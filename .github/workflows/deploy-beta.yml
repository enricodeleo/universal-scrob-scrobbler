name: Deploy Beta

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  deploy_beta_version:
    name: Deploy beta version
    if: ${{ !contains(github.event.head_commit.message, '[skip-beta]') && !contains(github.event.head_commit.message, '[bump-version]') }}
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_NODE_TYPE: node24
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
      CHROME_EXTENSION_KEY: ${{ secrets.CHROME_EXTENSION_KEY }}
      FIREFOX_EXTENSION_ID: ${{ secrets.FIREFOX_EXTENSION_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install
      - name: Build
        run: pnpm run build
      - name: Deploy version
        uses: ./.github/actions/deploy-beta
        with:
          github-token: '${{ secrets.GITHUB_TOKEN }}'
