name: New Version

on:
  workflow_dispatch:
    inputs:
      versionType:
        description: 'Version type'
        required: true
        default: 'patch'
        type: choice
        options:
          - major
          - minor
          - patch

permissions:
  contents: write

jobs:
  release_new_version:
    name: Release new version
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_NODE_TYPE: node24
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT || secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install
      - name: Update version in package.json
        uses: ./.github/actions/update-version
        with:
          version-type: '${{ inputs.versionType }}'
      - name: Format package.json
        run: pnpm run fix
      - name: Setup git config
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Commit and push changes to package.json
        run: |
          version=$(sed -n 's/.*"version": "\(.*\)".*/\1/p' package.json)
          git add package.json
          git commit -m "[bump-version] $version"
          git push origin master
