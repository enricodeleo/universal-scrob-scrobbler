name: Deploy Stable

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  deploy_stable_version:
    name: Deploy stable version
    if: ${{ contains(github.event.head_commit.message, '[bump-version]') }}
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_NODE_TYPE: node24
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
      CHROME_EXTENSION_KEY: ${{ secrets.CHROME_EXTENSION_KEY }}
      CHROME_PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
      FIREFOX_EXTENSION_ID: ${{ secrets.FIREFOX_EXTENSION_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install
      - name: Build
        run: pnpm run build
      - name: Deploy version
        uses: ./.github/actions/deploy-stable
        with:
          github-token: '${{ secrets.GITHUB_TOKEN }}'
      - name: Upload to Chrome store
        env:
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
        run: node .github/scripts/upload-chrome-webstore.js ./dist/chrome.zip
      - name: Upload to Firefox store
        env:
          FIREFOX_CLIENT_ID: ${{ secrets.FIREFOX_CLIENT_ID }}
          FIREFOX_CLIENT_SECRET: ${{ secrets.FIREFOX_CLIENT_SECRET }}
        run: node .github/scripts/upload-firefox-addon.js ./dist/firefox.zip
